name: Apply audited UI fixes

on:
  push:
    branches: [fix/browser-audit-mobile-dark]
    paths:
      - '.github/scripts/apply_ui_fixes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/browser-audit-mobile-dark
      - name: Apply source fixes
        run: python3 .github/scripts/apply_ui_fixes.py
      - name: Validate no custom CSS was introduced
        run: |
          test ! -f assets/app.css
          test ! -f assets/games.css
          test ! -f assets/benchmark.css
          ! grep -R -n 'style=' index.html games.html benchmark.html assets/ui.js assets/app.js assets/games.js assets/benchmark.js assets/certificates.js
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html games.html benchmark.html assets/ui.js assets/app.js assets/games.js assets/benchmark.js
          git commit -m 'Fix dark theme, mobile overflow and skeleton lifecycle'
          git push origin HEAD:fix/browser-audit-mobile-dark
