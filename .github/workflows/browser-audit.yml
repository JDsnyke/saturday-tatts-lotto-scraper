name: Branch browser audit

on:
  push:
    branches: [fix/browser-audit-mobile-dark]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start branch static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/lotto-http.log 2>&1 &
          echo $! >/tmp/lotto-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/lotto-http.log
          exit 1
      - name: Capture branch screenshots and DOM diagnostics
        env:
          AUDIT_BASE: http://127.0.0.1:8000/
        run: node .github/scripts/browser_audit.mjs
      - name: Print audit summary
        run: |
          node - <<'NODE'
          const report = require('./browser-audit/audit.json');
          for (const row of report) {
            console.log(JSON.stringify({
              page: row.page,
              viewport: row.viewport,
              theme: row.theme,
              dataTheme: row.dataTheme,
              scrollWidth: row.scrollWidth,
              innerWidth: row.innerWidth,
              skeletonCount: row.skeletonCount,
              overflow: row.overflow,
              consoleErrors: row.consoleErrors,
              requestFailures: row.requestFailures,
              html: row.html,
              body: row.body,
              navbar: row.navbar,
              hero: row.hero,
              heroBox: row.heroBox,
              heroBoxTitle: row.heroBoxTitle,
              firstBox: row.firstBox,
              firstSection: row.firstSection,
            }));
          }
          NODE
      - name: Enforce responsive/theme browser invariants
        run: |
          node - <<'NODE'
          const report = require('./browser-audit/audit.json');
          for (const row of report) {
            if (row.consoleErrors.length) throw new Error(`${row.page}/${row.viewport}/${row.theme}: console errors`);
            if (row.requestFailures.length) throw new Error(`${row.page}/${row.viewport}/${row.theme}: request failures`);
            if (row.skeletonCount) throw new Error(`${row.page}/${row.viewport}/${row.theme}: ${row.skeletonCount} visible skeletons remain`);
            if (row.scrollWidth > row.innerWidth + 1) throw new Error(`${row.page}/${row.viewport}/${row.theme}: page overflows ${row.scrollWidth}px > ${row.innerWidth}px`);
            if (row.dataTheme !== row.theme) throw new Error(`${row.page}/${row.viewport}: theme mismatch`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-browser-audit
          path: browser-audit/
          retention-days: 7
