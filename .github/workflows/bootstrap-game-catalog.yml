name: Bootstrap generated game catalog

on:
  push:
    branches:
      - roadmap/v3-game-catalog

permissions:
  contents: write

concurrency:
  group: bootstrap-game-catalog-v3
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Regenerate canonical asset
        env:
          PYTHONPATH: src
        run: python -m lotto_lab game-catalog-json --output assets/game_catalog.json
      - name: Commit only generated catalog when changed
        run: |
          if git diff --quiet -- assets/game_catalog.json; then
            echo 'Catalog already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/game_catalog.json
          git commit -m 'build: regenerate v3 game catalog asset'
          git push origin HEAD:roadmap/v3-game-catalog
