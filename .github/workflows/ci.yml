name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate existing dataset
        env:
          PYTHONPATH: src
        run: python -m lotto_lab stats
      - name: Validate static site references
        run: |
          test -f index.html
          test -f assets/app.css
          test -f assets/app.js
          test -f assets/lotto_stats.json
          grep -q 'assets/app.css' index.html
          grep -q 'assets/app.js' index.html
