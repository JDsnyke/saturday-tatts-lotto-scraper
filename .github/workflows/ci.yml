name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --ignore-scripts --no-audit --no-fund
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate multi-game catalog CLI
        env:
          PYTHONPATH: src
        run: |
          python -m lotto_lab games --json > /tmp/games.json
          python -m json.tool /tmp/games.json >/dev/null
          python -m lotto_lab game-odds --game powerball > /tmp/powerball.json
          python -m lotto_lab keno --spot 10 > /tmp/keno.json
          python -m lotto_lab cash3 --digits 223 > /tmp/cash3.json
          python -m json.tool /tmp/powerball.json >/dev/null
          python -m json.tool /tmp/keno.json >/dev/null
          python -m json.tool /tmp/cash3.json >/dev/null
          python - <<'PY'
          import json

          with open('/tmp/games.json', encoding='utf-8') as handle:
              games = {row['slug']: row for row in json.load(handle)}
          assert games['saturday-lotto']['computedTopOdds'] == 8_145_060
          assert games['oz-lotto']['computedTopOdds'] == 62_891_499
          assert games['powerball']['computedTopOdds'] == 134_490_400
          assert games['set-for-life']['computedTopOdds'] == 38_320_568
          assert games['super-66']['computedTopOdds'] == 1_000_000
          assert games['lotto-strike']['computedTopOdds'] == 3_575_880
          assert games['cash-3']['computedTopOdds'] == 1_000
          assert games['lucky-lotteries-mega']['computedTopOdds'] is None
          assert games['keno-sa']['computedTopOdds'] is None

          with open('/tmp/powerball.json', encoding='utf-8') as handle:
              powerball = json.load(handle)
          assert powerball['computedTopMatchesOfficial'] is True
          assert powerball['computedTopPrize']['denominator'] == 134_490_400

          with open('/tmp/keno.json', encoding='utf-8') as handle:
              keno = json.load(handle)
          assert keno['spot'] == 10
          assert 8_900_000 < keno['allSpotOdds'] < 8_920_000

          with open('/tmp/cash3.json', encoding='utf-8') as handle:
              cash3 = json.load(handle)
          assert cash3['distinctOrderings'] == 3
          assert 333 < cash3['anyOrderOdds'] < 334
          PY
      - name: Validate existing dataset and regenerate canonical publication assets
        env:
          PYTHONPATH: src
        run: |
          python -m lotto_lab stats
          python -m json.tool assets/lotto_stats.json >/dev/null
          python -m json.tool assets/data_provenance.json >/dev/null
          python - <<'PY'
          import json

          with open('assets/lotto_stats.json', encoding='utf-8') as handle:
              stats = json.load(handle)
          assert stats['schemaVersion'] == 3
          assert stats['dataset']['drawCount'] > 0
          assert stats['draws']
          exact = stats['referenceCoverageSet']['exactAnyPrize']
          certificate = stats['referenceCoverageSet']['metrics']['probabilityCertificates']['anyPrize']
          assert exact['exact'] is True
          assert exact['totalWinningMainSets'] == 8_145_060
          assert certificate['bonferroniLowerBound'] <= exact['probability']
          assert exact['probability'] <= certificate['firstOrderUnionBound']
          print('REFERENCE_EXACT_ANY_PRIZE=' + json.dumps(exact, sort_keys=True))
          PY
      - name: Build self-contained site payload
        run: bash .github/scripts/prepare_site.sh
      - name: Validate certified objective benchmark
        env:
          PYTHONPATH: src
        run: |
          python -m lotto_lab benchmark-objectives \
            --count 10 \
            --portfolios 12 \
            --random-portfolios 48 \
            --trials 4000 \
            --seed 20260822 \
            --candidates-per-ticket 320 \
            --bootstrap-resamples 800 > /tmp/objectives.json
          python -m json.tool /tmp/objectives.json >/dev/null
          python - <<'PY'
          import json

          with open('/tmp/objectives.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['divisionOneProbabilityEqual'] is True
          for strategy in ('coverage', 'anyPrizeBound', 'division4Bound', 'random'):
              assert strategy in result['strategies']
          summary = {
              strategy: {
                  'anyPrizeRate': round(result['strategies'][strategy]['anyPrizeRate']['mean'], 6),
                  'anyPrizeLowerBound': round(result['strategies'][strategy]['anyPrizeBonferroniLowerBound']['mean'], 6),
                  'division4Rate': round(result['strategies'][strategy]['division4OrBetterRate']['mean'], 6),
                  'division4GlobalOptimalRate': round(result['strategies'][strategy]['division4GloballyOptimal']['mean'], 4),
              }
              for strategy in ('coverage', 'anyPrizeBound', 'division4Bound', 'random')
          }
          comparisons = {}
          for name, metrics in result['comparisons'].items():
              comparisons[name] = {}
              for metric, values in metrics.items():
                  if values.get('inferenceSuppressed'):
                      comparisons[name][metric] = {
                          'inferenceSuppressed': True,
                          'exactProbabilityDifference': values['exactProbabilityDifference'],
                          'descriptiveSimulatedMeanDifference': round(values['descriptiveSimulatedMeanDifference'], 8),
                          'reason': values['reason'],
                      }
                      continue
                  comparisons[name][metric] = {
                      'inferenceSuppressed': False,
                      'favourableMeanDifference': round(values['favourableMeanDifference'], 8),
                      'ci95': [round(value, 8) for value in values['bootstrapMeanDifferenceCi95']],
                      'probabilityOfSuperiority': round(values['probabilityOfSuperiority'], 6),
                  }
          suppressed = result['comparisons']['division4BoundVsCoverage']['division4OrBetterRate']
          assert suppressed['inferenceSuppressed'] is True
          assert suppressed['exactProbabilityDifference'] == 0.0
          assert suppressed['bootstrapMeanDifferenceCi95'] is None
          assert suppressed['probabilityOfSuperiority'] is None
          print('CERTIFIED_OBJECTIVE_SUMMARY=' + json.dumps(summary, sort_keys=True))
          print('CERTIFIED_OBJECTIVE_COMPARISONS=' + json.dumps(comparisons, sort_keys=True))
          PY
      - name: Validate exact any-prize objective benchmark
        env:
          PYTHONPATH: src
        run: |
          python -m lotto_lab benchmark-exact-objectives \
            --count 10 \
            --portfolios 12 \
            --random-portfolios 48 \
            --seed 20260822 \
            --candidates-per-ticket 320 \
            --bootstrap-resamples 800 > /tmp/exact-objectives.json
          python -m json.tool /tmp/exact-objectives.json >/dev/null
          python - <<'PY'
          import json

          with open('/tmp/exact-objectives.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['exact'] is True
          assert result['divisionOneProbabilityEqual'] is True
          assert result['portfolioSeedsMatchSimulatedObjectiveBenchmark'] is True
          for strategy in ('coverage', 'anyPrizeBound', 'division4Bound', 'random'):
              metrics = result['strategies'][strategy]
              assert metrics['bonferroniGap']['min'] >= 0
              assert metrics['exactAnyPrizeProbability']['min'] >= 0
          summary = {
              strategy: {
                  'exactAnyPrize': round(result['strategies'][strategy]['exactAnyPrizeProbability']['mean'], 8),
                  'lowerBound': round(result['strategies'][strategy]['anyPrizeBonferroniLowerBound']['mean'], 8),
                  'meanBoundGap': round(result['strategies'][strategy]['bonferroniGap']['mean'], 8),
              }
              for strategy in ('coverage', 'anyPrizeBound', 'division4Bound', 'random')
          }
          comparisons = {
              name: {
                  metric: {
                      'favourableMeanDifference': round(values['favourableMeanDifference'], 10),
                      'ci95': [round(value, 10) for value in values['bootstrapMeanDifferenceCi95']],
                      'probabilityOfSuperiority': round(values['probabilityOfSuperiority'], 6),
                  }
                  for metric, values in metrics.items()
              }
              for name, metrics in result['comparisons'].items()
          }
          print('EXACT_OBJECTIVE_BEST=' + result['bestExactMeanStrategy'])
          print('EXACT_OBJECTIVE_SUMMARY=' + json.dumps(summary, sort_keys=True))
          print('EXACT_OBJECTIVE_COMPARISONS=' + json.dumps(comparisons, sort_keys=True))
          PY
      - name: Validate browser JavaScript
        run: |
          node --check assets/ui.js
          node --check assets/app.js
          node --check assets/benchmark.js
          node --check assets/certificates.js
          node --check assets/games.js
          node --check service-worker.js
          node --check .github/scripts/browser_audit.mjs
      - name: Validate self-contained Bulma-only site
        run: |
          test -f _site/index.html
          test -f _site/benchmark.html
          test -f _site/games.html
          test -f _site/assets/ui.js
          test -f _site/assets/app.js
          test -f _site/assets/benchmark.js
          test -f _site/assets/certificates.js
          test -f _site/assets/games.js
          test -s _site/assets/vendor/bulma.min.css
          test -s _site/assets/vendor/lucide.js
          test ! -f _site/assets/app.css
          test ! -f _site/assets/benchmark.css
          test ! -f _site/assets/games.css
          grep -q 'assets/vendor/bulma.min.css' _site/index.html
          grep -q 'assets/vendor/bulma.min.css' _site/benchmark.html
          grep -q 'assets/vendor/bulma.min.css' _site/games.html
          grep -q 'assets/vendor/lucide.js' _site/index.html
          grep -q 'assets/vendor/lucide.js' _site/benchmark.html
          grep -q 'assets/vendor/lucide.js' _site/games.html
          ! grep -q 'cdn.jsdelivr.net' _site/index.html
          ! grep -q 'unpkg.com' _site/index.html
          grep -q 'assets/ui.js' _site/index.html
          grep -q 'assets/app.js' _site/index.html
          grep -q 'assets/benchmark.js' _site/benchmark.html
          grep -q 'assets/certificates.js' _site/benchmark.html
          grep -q 'id="certificates"' _site/benchmark.html
          grep -q 'id="cert-any-exact"' _site/benchmark.html
          grep -q 'exactAnyPrize' _site/assets/certificates.js
          grep -q 'assets/games.js' _site/games.html
          grep -q 'id="game-grid"' _site/games.html
          grep -q 'id="keno-spot"' _site/games.html
          grep -q 'games.html' _site/assets/site.webmanifest
          grep -q 'assets/vendor/bulma.min.css' _site/service-worker.js
          grep -q 'assets/vendor/lucide.js' _site/service-worker.js
          ! grep -q 'cdn.jsdelivr.net' _site/service-worker.js
          ! grep -q 'unpkg.com' _site/service-worker.js
          ! grep -R -n 'style=' _site/index.html _site/games.html _site/benchmark.html _site/assets/ui.js _site/assets/app.js _site/assets/games.js _site/assets/benchmark.js _site/assets/certificates.js
