name: Refresh lotto data

on:
  schedule:
    # Sunday 11:00 Australia/Brisbane (01:00 UTC), after Saturday night's draw.
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Scrape current results
        env:
          PYTHONPATH: src
        run: python -m lotto_lab scrape
      - name: Decide whether publication assets need rebuilding
        id: publish
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          import subprocess

          csv_changed = subprocess.run(
              ['git', 'diff', '--quiet', '--', 'winning_numbers.csv', 'supplementary_numbers.csv']
          ).returncode != 0

          stats = Path('assets/lotto_stats.json')
          provenance = Path('assets/data_provenance.json')
          verification = Path('assets/secondary_verification.json')
          schema_ok = False
          if stats.exists():
              try:
                  schema_ok = json.loads(stats.read_text(encoding='utf-8')).get('schemaVersion') == 3
              except (OSError, json.JSONDecodeError):
                  pass
          provenance_ok = provenance.exists()
          if provenance_ok:
              try:
                  provenance_ok = json.loads(provenance.read_text(encoding='utf-8')).get('status') != 'bootstrap-placeholder'
              except (OSError, json.JSONDecodeError):
                  provenance_ok = False

          needs_publish = csv_changed or not schema_ok or not provenance_ok or not verification.exists()
          print(f"needed={'true' if needs_publish else 'false'}")
          PY
      - name: Cross-check newest draws against secondary source
        if: steps.publish.outputs.needed == 'true'
        env:
          PYTHONPATH: src
        run: python -m lotto_lab verify-secondary --latest 10
      - name: Regenerate statistics and provenance
        if: steps.publish.outputs.needed == 'true'
        env:
          PYTHONPATH: src
        run: python -m lotto_lab stats
      - name: Commit verified changed assets directly
        if: steps.publish.outputs.needed == 'true'
        run: |
          if git diff --quiet -- winning_numbers.csv supplementary_numbers.csv assets/lotto_stats.json \
            assets/data_provenance.json assets/secondary_verification.json; then
            echo 'No tracked data or generated asset changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- winning_numbers.csv supplementary_numbers.csv \
            assets/lotto_stats.json assets/data_provenance.json assets/secondary_verification.json
          git commit -m 'data: refresh and verify Saturday Lotto results'
          git push origin HEAD:main
