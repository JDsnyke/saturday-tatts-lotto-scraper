name: Refresh lotto data

on:
  schedule:
    # Sunday 11:00 Australia/Brisbane (01:00 UTC), after Saturday night's draw.
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Scrape current results
        env:
          PYTHONPATH: src
        run: python -m lotto_lab scrape
      - name: Check whether draw data changed
        id: changes
        run: |
          if git diff --quiet -- winning_numbers.csv supplementary_numbers.csv; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Regenerate statistics
        if: steps.changes.outputs.changed == 'true'
        env:
          PYTHONPATH: src
        run: python -m lotto_lab stats
      - name: Commit changed data directly
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- winning_numbers.csv supplementary_numbers.csv assets/lotto_stats.json
          git commit -m 'data: refresh Saturday Lotto results'
          git push origin HEAD:main
