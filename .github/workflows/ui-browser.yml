name: UI browser

on:
  pull_request:
    paths:
      - 'index.html'
      - 'games.html'
      - 'benchmark.html'
      - 'assets/ui.js'
      - 'assets/app.js'
      - 'assets/games.js'
      - 'assets/benchmark.js'
      - 'assets/certificates.js'
      - 'service-worker.js'
      - '.github/scripts/browser_audit.mjs'
      - '.github/workflows/ui-browser.yml'

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Chromium audit runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/lotto-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/lotto-http.log
          exit 1
      - name: Audit desktop/mobile light/dark rendering
        env:
          AUDIT_BASE: http://127.0.0.1:8000/
        run: node .github/scripts/browser_audit.mjs
      - name: Upload screenshots only when the gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-failure
          path: browser-audit/
          retention-days: 3
