name: UI browser

on:
  pull_request:
    paths:
      - 'index.html'
      - 'games.html'
      - 'benchmark.html'
      - 'assets/ui.js'
      - 'assets/app.js'
      - 'assets/games.js'
      - 'assets/benchmark.js'
      - 'assets/certificates.js'
      - 'service-worker.js'
      - 'package.json'
      - '.github/scripts/prepare_site.sh'
      - '.github/scripts/browser_audit.mjs'
      - '.github/workflows/ui-browser.yml'

permissions:
  contents: read

concurrency:
  group: ui-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned site, runtime and Chromium dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          python -m pip install -r requirements.txt
          npx playwright install --with-deps chromium
      - name: Regenerate canonical publication data
        env:
          PYTHONPATH: src
        run: python -m lotto_lab stats
      - name: Build self-contained site payload
        run: bash .github/scripts/prepare_site.sh
      - name: Start built static site
        run: |
          cd _site
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/lotto-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/lotto-http.log
          exit 1
      - name: Audit desktop/mobile light/dark rendering
        env:
          AUDIT_BASE: http://127.0.0.1:8000/
        run: node .github/scripts/browser_audit.mjs
      - name: Upload screenshots only when the gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-browser-failure
          path: browser-audit/
          retention-days: 3
